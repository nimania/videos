name: Publish Nimania Videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'styles.css', 'app.js', 'detail.js', 'scripts/**', 'data/relations.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: videos-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalogue builder
        run: python -m unittest discover -s tests -v
      - name: Build independent static snapshot
        run: python scripts/build_catalog.py --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
